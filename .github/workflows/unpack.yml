name: Install prepared web app
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack prepared app
        run: |
          test -f bundle.zip || exit 0
          rm -rf /tmp/rubik-pages
          mkdir -p /tmp/rubik-pages
          unzip -q bundle.zip -d /tmp/rubik-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bundle.zip -exec rm -rf {} +
          cp -a /tmp/rubik-pages/. .
          rm -f bundle.zip
      - name: Commit prepared app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Install prepared GitHub Pages web app'
          git push

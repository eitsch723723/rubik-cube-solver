name: Test and Deploy App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production-v3
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build self-contained Pages artifact
        run: node scripts/build-site.mjs

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check release-fixes.js
          node --check features.js
          node --check tetra-core.js
          node --check tetra-worker.js
          node --check tetra-visuals.js
          node --check cube/app.js
          node --check cube/solver-worker.js
          node --check sw.js

      - name: Tetraeder solver unit regression
        run: node tests/unit.cjs

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.48.2

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start local test server
        run: python3 -m http.server 4173 --directory site >/tmp/rubik-http.log 2>&1 &

      - name: Chromium and WebKit regression
        run: npx playwright test --config=tests/playwright.config.js

      - name: Upload tested site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

  deploy:
    needs: test-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  post-deploy-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Test deployed production site
        run: node .github/production-smoke.mjs
